<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Запуск команды</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --text: #000; --muted: #6c6c70; --tint: #007aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #fff; --muted: #98989f; --tint: #0a84ff; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; text-align: center; }
  main { padding: 24px 16px; max-width: 420px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.btn { display: block; padding: 15px; border-radius: 14px; background: var(--tint); color: #fff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Запускаем «Фото в Telegram»</h1>
  <p>iPhone спросит, открыть ли «Команды», — нажмите «Открыть». Когда фото уйдут, iPhone вернёт вас в Telegram.</p>
  <a class="btn" id="run" href="#">Запустить команду</a>
</main>
<script>
  // «Команды» запускают «Фото в Telegram» и по окончании возвращают в Telegram.
  var back = encodeURIComponent('tg://');
  var url = 'shortcuts://x-callback-url/run-shortcut?name=' + encodeURIComponent('Фото в Telegram') +
    '&x-success=' + back + '&x-cancel=' + back + '&x-error=' + back;
  document.getElementById('run').href = url;
  location.href = url;
</script>
</body>
</html>
